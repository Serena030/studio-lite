<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdf4f6">
<title>Studio</title>
<style>
  :root{
    --bg:#fdf4f6;
    --bg-2:#fbeef2;
    --card:rgba(255,255,255,.72);
    --card-solid:#fffdfe;
    --line:rgba(190,150,165,.20);
    --line-2:rgba(190,150,165,.34);
    --text:#4a3d43;
    --muted:#9b8790;
    --dim:#bcaab2;
    --accent:#d98ba6;
    --accent-soft:rgba(217,139,166,.14);
    --shadow:rgba(190,150,165,.16);
    --s-inbox:#b79bd0;
    --s-queued:#a9a4b4;
    --s-working:#7fb6a6;
    --s-review:#d8a86a;
    --s-failed:#d08a8a;
    --s-merged:#b6aeb2;
    --serif:"Cochin","Iowan Old Style","Baskerville",Georgia,"Songti SC",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(1200px 700px at 15% -10%, #fff 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, var(--bg-2) 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);font:15px/1.7 var(--sans);
    min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 16px 40px;
  }
  .wrap{max-width:720px;margin:0 auto}
  .head{text-align:center;margin-bottom:22px}
  .head h1{font:400 34px/1.2 var(--serif);letter-spacing:.5px;color:var(--text)}
  .head p{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.06em}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .chips button{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:5px 13px;border-radius:999px;font:400 12.5px/1.5 var(--sans);cursor:pointer;
    backdrop-filter:blur(6px);transition:.16s;
  }
  .chips button.on{background:var(--accent-soft);border-color:var(--line-2);color:var(--text)}
  .compose{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:14px;margin-bottom:18px;backdrop-filter:blur(10px);
    box-shadow:0 2px 14px var(--shadow);
  }
  .compose input,.compose textarea{
    width:100%;border:0;background:transparent;color:var(--text);
    font:400 15px/1.65 var(--sans);resize:none;outline:none;
  }
  .compose input{font-size:16px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .compose textarea{min-height:56px;padding-top:9px}
  .compose input::placeholder,.compose textarea::placeholder{color:var(--dim)}
  .compose .row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .btn{
    border:1px solid var(--line-2);background:var(--card-solid);color:var(--text);
    padding:6px 15px;border-radius:999px;font:400 13px/1.5 var(--sans);cursor:pointer;
    transition:.16s;
  }
  .btn:active{transform:scale(.97)}
  .btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .list{display:flex;flex-direction:column;gap:9px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:13px 15px;cursor:pointer;backdrop-filter:blur(10px);
    box-shadow:0 2px 12px var(--shadow);transition:.16s;
  }
  .card:active{transform:scale(.994)}
  .card .top{display:flex;align-items:baseline;gap:8px}
  .card .no{font:500 11.5px/1 var(--serif);letter-spacing:.08em;color:var(--dim)}
  .card .st{
    margin-left:auto;font-size:11px;padding:2px 9px;border-radius:999px;
    background:var(--accent-soft);color:var(--muted);white-space:nowrap;
  }
  .card h3{font:500 15.5px/1.5 var(--sans);margin-top:4px;color:var(--text)}
  .card .sub{font-size:12px;color:var(--dim);margin-top:3px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:34px 0}
  .tools{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .tools select{
    border:1px solid var(--line);background:var(--card-solid);color:var(--muted);
    border-radius:999px;padding:5px 11px;font:400 12.5px/1.4 var(--sans);outline:none;
  }
  .clip{
    border:1px solid var(--line);background:var(--card-solid);color:var(--muted);
    border-radius:999px;padding:5px 12px;font:400 12.5px/1.4 var(--sans);cursor:pointer;
  }
  .picked{font-size:12px;color:var(--dim);flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .atts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 0}
  .att{
    position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--bg-2);
  }
  .att img{display:block;width:96px;height:96px;object-fit:cover}
  .att .doc{
    width:96px;height:96px;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:5px;padding:8px;text-align:center;
  }
  .att .doc b{font:400 20px/1 var(--serif);color:var(--dim)}
  .att .doc span{font-size:10.5px;color:var(--muted);line-height:1.4;
    word-break:break-all;max-height:44px;overflow:hidden}
  .att .kill{
    position:absolute;right:4px;top:4px;width:20px;height:20px;border:0;border-radius:50%;
    background:rgba(74,61,67,.55);color:#fff;font-size:13px;line-height:1;cursor:pointer;
  }
</style>
</head>
<style>
  .sheet{
    position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(74,61,67,0);visibility:hidden;transition:background .24s,visibility .24s;
  }
  .sheet.on{visibility:visible;background:rgba(74,61,67,.28)}
  .sheet .card2{
    width:100%;max-width:720px;max-height:88dvh;display:flex;flex-direction:column;
    background:var(--card-solid);border-radius:22px 22px 0 0;
    box-shadow:0 -10px 34px var(--shadow);transform:translateY(100%);
    transition:transform .3s cubic-bezier(.22,.9,.3,1);overflow:hidden;
  }
  .sheet.on .card2{transform:translateY(0)}
  .sheet .grip{flex:none;display:grid;place-items:center;padding:9px 0 3px}
  .sheet .grip i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2)}
  .sheet .bar{
    flex:none;display:flex;align-items:center;gap:9px;padding:4px 16px 11px;
    border-bottom:1px solid var(--line);
  }
  .sheet .bar .no{font:500 12px/1 var(--serif);letter-spacing:.08em;color:var(--dim)}
  .sheet .bar .x{
    margin-left:auto;border:0;background:var(--accent-soft);color:var(--muted);
    width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
  }
  .sheet .body{flex:1;min-height:0;overflow-y:auto;padding:15px 16px 8px;-webkit-overflow-scrolling:touch}
  .sheet h2{font:500 18px/1.45 var(--sans);margin-bottom:6px}
  .sheet .desc{font-size:13.5px;color:var(--muted);white-space:pre-wrap;margin-bottom:14px}
  .sheet .acts{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .talk{display:flex;flex-direction:column;gap:10px;padding:14px 0 4px}
  .talk .m{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
  .talk .m.me{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--line)}
  .talk .m.worker{align-self:flex-start;background:var(--bg-2);border:1px solid var(--line)}
  .talk .m .who{display:block;font-size:10.5px;color:var(--dim);margin-bottom:3px;letter-spacing:.06em}
  .sheet .foot{
    flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--card-solid);
  }
  .sheet .foot textarea{
    flex:1;border:1px solid var(--line);border-radius:14px;background:var(--bg);
    padding:9px 12px;font:400 14.5px/1.6 var(--sans);color:var(--text);resize:none;
    max-height:120px;outline:none;
  }
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(14px);
    background:var(--text);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;z-index:80;
  }
  .toast.on{opacity:.92;transform:translateX(-50%) translateY(0)}
</style>
<body>
<div class="wrap">
  <div class="head">
    <h1>Studio</h1>
    <p>提一张单，交出去，等它回来</p>
  </div>
  <div class="chips" data-chips></div>
  <div class="compose">
    <input data-title placeholder="要做什么" maxlength="120">
    <textarea data-body placeholder="说清楚一点（可以不写）" rows="2"></textarea>
    <div class="tools">
      <select data-model title="用哪个模型"></select>
      <button class="clip" data-clip>贴图 / 附件</button>
      <input type="file" data-file multiple hidden>
      <span class="picked" data-picked></span>
    </div>
    <div class="row"><button class="btn main" data-add>开一张</button></div>
  </div>
  <div class="list" data-list></div>
</div>

<div class="sheet" data-sheet>
  <div class="card2">
    <div class="grip"><i></i></div>
    <div class="bar">
      <span class="no" data-sno></span>
      <span class="card" style="padding:2px 9px;border-radius:999px;font-size:11px;color:var(--muted);background:var(--accent-soft);border:0;box-shadow:none" data-sst></span>
      <button class="x" data-close>&times;</button>
    </div>
    <div class="body">
      <h2 data-stitle></h2>
      <div class="desc" data-sdesc></div>
      <div class="acts" data-sacts></div>
      <div class="atts" data-satts></div>
      <div class="talk" data-stalk></div>
    </div>
    <div class="foot">
      <button class="clip" data-clip2 title="贴图 / 附件">＋</button>
      <input type="file" data-file2 multiple hidden>
      <textarea data-say placeholder="在这张单底下说句话" rows="1"></textarea>
      <button class="btn" data-send>发</button>
    </div>
  </div>
</div>
<div class="toast" data-toast></div>
<script>
const $ = s => document.querySelector(s);
const TOKEN = new URLSearchParams(location.search).get("token") || localStorage.getItem("studio.token") || "";
if (TOKEN) localStorage.setItem("studio.token", TOKEN);

const ST = {
  inbox:   "待安排",
  queued:  "排着",
  working: "在做",
  review:  "交回来了",
  failed:  "塌了",
  merged:  "收工",
};
const TABS = [["", "全部"], ["inbox", "待安排"], ["working", "在做"], ["review", "交回来了"], ["failed", "塌了"], ["merged", "收工"]];

let filter = "";
let openNo = "";
let timer = 0;

async function api(path, opts = {}) {
  const headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  if (TOKEN) headers["X-Token"] = TOKEN;
  const r = await fetch(path, Object.assign({}, opts, {headers}));
  if (!r.ok) {
    let why = "HTTP " + r.status;
    try { why = (await r.json()).detail || why; } catch {}
    throw new Error(why);
  }
  return r.status === 204 ? null : r.json();
}

function toast(text) {
  const t = $("[data-toast]");
  t.textContent = text;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1800);
}

function drawChips() {
  const box = $("[data-chips]");
  box.innerHTML = "";
  for (const [key, name] of TABS) {
    const b = document.createElement("button");
    b.textContent = name;
    if (key === filter) b.className = "on";
    b.onclick = () => { filter = key; drawChips(); load(); };
    box.appendChild(b);
  }
}

function card(item) {
  const d = document.createElement("div");
  d.className = "card";
  const top = document.createElement("div");
  top.className = "top";
  const no = document.createElement("span");
  no.className = "no"; no.textContent = item.no;
  const st = document.createElement("span");
  st.className = "st";
  st.textContent = ST[item.status] || item.status;
  st.style.color = "var(--s-" + item.status + ")";
  top.append(no, st);
  const h = document.createElement("h3");
  h.textContent = item.title;
  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = (item.worker ? item.worker + " · " : "") + (item.updated_at || "").slice(5, 16);
  d.append(top, h, sub);
  d.onclick = () => openSheet(item.no);
  return d;
}

async function load() {
  try {
    const data = await api("/api/orders" + (filter ? "?status=" + filter : ""));
    const box = $("[data-list]");
    box.innerHTML = "";
    if (!data.items.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "这里还什么都没有";
      box.appendChild(e);
      return;
    }
    for (const item of data.items) box.appendChild(card(item));
  } catch (e) { toast(e.message); }
}
</script>
<script>
async function openSheet(no) {
  openNo = no;
  $("[data-sheet]").classList.add("on");
  await drawSheet();
}

function closeSheet() {
  openNo = "";
  $("[data-sheet]").classList.remove("on");
}

function actButton(text, main, fn) {
  const b = document.createElement("button");
  b.className = "btn" + (main ? " main" : "");
  b.textContent = text;
  b.onclick = fn;
  return b;
}

async function drawSheet() {
  if (!openNo) return;
  let item;
  try { item = await api("/api/orders/" + openNo); }
  catch (e) { toast(e.message); return; }

  $("[data-sno]").textContent = item.no;
  const st = $("[data-sst]");
  st.textContent = ST[item.status] || item.status;
  st.style.color = "var(--s-" + item.status + ")";
  $("[data-stitle]").textContent = item.title;
  $("[data-sdesc]").textContent = ((item.body || "").trim() || "（没写正文）")
    + (item.model ? "\n\n模型：" + item.model : "");

  const acts = $("[data-sacts]");
  acts.innerHTML = "";
  if (item.status !== "working") {
    acts.appendChild(actButton(item.status === "failed" ? "再跑一次" : "交出去跑", true, async () => {
      try {
        const r = await api("/api/orders/" + item.no + "/run", {method: "POST"});
        toast(r.ok ? "派出去了" : r.why);
        drawSheet(); load();
      } catch (e) { toast(e.message); }
    }));
  }
  if (item.status === "review") {
    acts.appendChild(actButton("收工", false, () => setStatus(item.no, "merged")));
  }
  if (item.status !== "inbox") {
    acts.appendChild(actButton("退回待安排", false, () => setStatus(item.no, "inbox")));
  }
  acts.appendChild(actButton("删掉", false, async () => {
    if (!confirm("这张单连着底下的话一起删，确定？")) return;
    try {
      await api("/api/orders/" + item.no, {method: "DELETE"});
      closeSheet(); load(); toast("删了");
    } catch (e) { toast(e.message); }
  }));
  if (item.err) {
    const bad = document.createElement("span");
    bad.style.cssText = "font-size:12px;color:var(--s-failed);align-self:center";
    bad.textContent = item.err;
    acts.appendChild(bad);
  }

  const attBox = $("[data-satts]");
  attBox.innerHTML = "";
  for (const a of item.atts || []) attBox.appendChild(attNode(a));

  const talk = $("[data-stalk]");
  talk.innerHTML = "";
  for (const m of item.msgs || []) {
    const d = document.createElement("div");
    d.className = "m " + (m.who === "worker" ? "worker" : "me");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = (m.who === "worker" ? "工人" : m.who) + " · " + (m.created_at || "").slice(5, 16);
    const p = document.createElement("span");
    p.textContent = m.text;
    d.append(who, p);
    talk.appendChild(d);
  }
  talk.scrollIntoView({block: "end"});
}

async function setStatus(no, status) {
  try {
    await api("/api/orders/" + no, {method: "PATCH", body: JSON.stringify({status})});
    drawSheet(); load();
  } catch (e) { toast(e.message); }
}

$("[data-add]").onclick = async () => {
  const title = $("[data-title]").value.trim();
  const body = $("[data-body]").value.trim();
  const model = $("[data-model]").value;
  if (!title) { toast("标题总得写一个"); return; }
  try {
    const made = await api("/api/orders", {method: "POST", body: JSON.stringify({title, body, model})});
    for (const f of pending) await upload(made.no, f);
    pending = [];
    $("[data-file]").value = "";
    $("[data-picked]").textContent = "";
    $("[data-title]").value = "";
    $("[data-body]").value = "";
    load(); toast("开好了");
  } catch (e) { toast(e.message); }
};

$("[data-close]").onclick = closeSheet;
$("[data-sheet]").onclick = e => { if (e.target === $("[data-sheet]")) closeSheet(); };

$("[data-send]").onclick = async () => {
  const el = $("[data-say]");
  const text = el.value.trim();
  if (!text || !openNo) return;
  try {
    await api("/api/orders/" + openNo + "/msg", {method: "POST", body: JSON.stringify({text})});
    el.value = ""; el.style.height = "auto";
    drawSheet();
  } catch (e) { toast(e.message); }
};

$("[data-say]").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});

async function upload(no, file) {
  const fd = new FormData();
  fd.append("f", file);
  const headers = {};
  if (TOKEN) headers["X-Token"] = TOKEN;
  const r = await fetch("/api/orders/" + no + "/upload", {method: "POST", body: fd, headers});
  if (!r.ok) {
    let why = "HTTP " + r.status;
    try { why = (await r.json()).detail || why; } catch {}
    throw new Error(why);
  }
  return r.json();
}

function fileURL(name) {
  return "/api/file/" + encodeURIComponent(name) + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
}

function attNode(a) {
  const d = document.createElement("div");
  d.className = "att";
  if ((a.mime || "").startsWith("image/")) {
    const img = document.createElement("img");
    img.src = fileURL(a.file);
    img.alt = a.name;
    d.appendChild(img);
  } else {
    const doc = document.createElement("div");
    doc.className = "doc";
    const b = document.createElement("b");
    b.textContent = (a.name.split(".").pop() || "file").slice(0, 5).toUpperCase();
    const sp = document.createElement("span");
    sp.textContent = a.name;
    doc.append(b, sp);
    d.appendChild(doc);
  }
  d.onclick = () => window.open(fileURL(a.file), "_blank");
  const kill = document.createElement("button");
  kill.className = "kill";
  kill.textContent = "×";
  kill.onclick = async e => {
    e.stopPropagation();
    try { await api("/api/atts/" + a.id, {method: "DELETE"}); drawSheet(); }
    catch (err) { toast(err.message); }
  };
  d.appendChild(kill);
  return d;
}

let pending = [];
$("[data-clip]").onclick = () => $("[data-file]").click();
$("[data-file]").onchange = e => {
  pending = Array.from(e.target.files || []);
  $("[data-picked]").textContent = pending.length
    ? "待贴 " + pending.length + " 个：" + pending.map(f => f.name).join("、")
    : "";
};

$("[data-clip2]").onclick = () => $("[data-file2]").click();
$("[data-file2]").onchange = async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";
  if (!openNo || !files.length) return;
  try {
    for (const f of files) await upload(openNo, f);
    drawSheet(); toast("贴上了");
  } catch (err) { toast(err.message); }
};

async function loadConfig() {
  try {
    const cfg = await api("/api/config");
    const sel = $("[data-model]");
    sel.innerHTML = "";
    const def = document.createElement("option");
    def.value = ""; def.textContent = "默认模型";
    sel.appendChild(def);
    for (const m of cfg.models || []) {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    }
  } catch {}
}

drawChips();
loadConfig();
load();
timer = setInterval(() => { load(); if (openNo) drawSheet(); }, 4000);
</script>
</body>
</html>
